name: Workflow Orchestrator

description: This workflow intends to extend the GitHub native concurrency feature to orchestrate multiple workflows / workflow runs.

inputs:
  group:
    description: >
      The name of the concurrency group to which this workflow run belongs.
      All workflow runs with the same group name will be orchestrated.
    default: ${{ github.run_id }}

  github-token:
    description: Personal access token (PAT) for authenticated git operations in the workflow.
    default: ${{ github.token }}

runs:
  using: "node20"
  main: "dist/index.js"
  post: "dist/post.js"
  post-if: "success()"
