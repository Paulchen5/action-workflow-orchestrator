name: Lint and Format Check

on:
  push:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    runs-on: [self-hosted, solinas]
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Project
        uses: ./.github/actions/setup-project/

      - name: Run eslint
        run: npm run lint

      - name: Renovate config validation
        run: npx --yes --package renovate -- renovate-config-validator

  format:
    runs-on: [self-hosted, solinas]
    needs: [lint]
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Project
        uses: ./.github/actions/setup-project/

      - name: Check code format
        run: npm run format-check
