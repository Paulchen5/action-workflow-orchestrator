# Copied from https://github.com/a2aproject/a2a-python/blob/98604e73eb5a70d5dac95a54b625b9cba2331372/.github/workflows/conventional-commits.yml
name: "Conventional Commits"

on:
  pull_request:
    types:
      - opened
      - edited
      - synchronize

permissions:
  contents: read

jobs:
  main:
    permissions:
      pull-requests: read
      statuses: write

    name: Validate PR Title

    runs-on: [self-hosted, solinas]

    steps:
      - name: semantic-pull-request
        uses: amannn/action-semantic-pull-request@v6.1.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          validateSingleCommit: false
